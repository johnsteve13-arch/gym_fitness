services:
  - type: web
    name: gym-fitness-api
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "https://gym-fitness.vercel.app,http://localhost:3000"
      - key: FRONTEND_URL
        value: "https://gym-fitness.vercel.app"
      - key: UNPAID_BOOKING_TIMEOUT_MINUTES
        value: 30
      - key: GRACE_PERIOD_DAYS
        value: 7
